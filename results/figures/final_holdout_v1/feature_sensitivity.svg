<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="655" viewBox="0 0 1090 655" role="img" aria-labelledby="title desc"><title id="title">Frozen final holdout feature sensitivity</title><desc id="desc">At the 1% review budget XGBoost catches 267 full, 169 without category and 141 without both. Logistic catches 254 full, 163 without category, and 135 without both. Whole-ranking average precision can rank model families differently in the reduced-feature variants.</desc><rect width="1090" height="655" fill="#fff"/><text x="50" y="52" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#20394C" font-weight="700" text-anchor="start">Feature dependence | Same frozen 1% review capacity</text><text x="50" y="84" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#566B7A" font-weight="400" text-anchor="start">Pooled synthetic holdout · 278 positive labels · fitted before final evaluation</text><rect x="55" y="103" width="15" height="15" fill="#C5742F" rx="2"/><text x="81" y="116" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#253D4F" font-weight="400" text-anchor="start">XGBoost</text><rect x="200" y="103" width="15" height="15" fill="#25536B" rx="2"/><text x="226" y="116" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#253D4F" font-weight="400" text-anchor="start">Logistic</text><line x1="117" x2="1037" y1="497" y2="497" stroke="#E6ECEF" /><text x="98" y="502" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">0</text><line x1="117" x2="1037" y1="438.7857142857143" y2="438.7857142857143" stroke="#E6ECEF" /><text x="98" y="443.7857142857143" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">50</text><line x1="117" x2="1037" y1="380.57142857142856" y2="380.57142857142856" stroke="#E6ECEF" /><text x="98" y="385.57142857142856" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">100</text><line x1="117" x2="1037" y1="322.35714285714283" y2="322.35714285714283" stroke="#E6ECEF" /><text x="98" y="327.35714285714283" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">150</text><line x1="117" x2="1037" y1="264.1428571428571" y2="264.1428571428571" stroke="#E6ECEF" /><text x="98" y="269.1428571428571" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">200</text><line x1="117" x2="1037" y1="205.9285714285714" y2="205.9285714285714" stroke="#E6ECEF" /><text x="98" y="210.9285714285714" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637783" font-weight="400" text-anchor="end">250</text><rect x="190" y="201.3" width="74" height="295.7" rx="4" fill="#25536B"/><text x="227" y="191.27142857142854" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">254</text><rect x="278" y="186.1" width="74" height="310.9" rx="4" fill="#C5742F"/><text x="315" y="176.13571428571424" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">267</text><text x="269" y="525" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243D51" font-weight="700" text-anchor="middle">Full 13 features</text><text x="269" y="550" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#596A76" font-weight="400" text-anchor="middle">AP: XGB 0.893 · LR 0.869</text><rect x="505" y="307.2" width="74" height="189.8" rx="4" fill="#25536B"/><text x="542" y="297.22142857142853" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">163</text><rect x="593" y="300.2" width="74" height="196.8" rx="4" fill="#C5742F"/><text x="630" y="290.23571428571427" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">169</text><text x="584" y="525" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243D51" font-weight="700" text-anchor="middle">Without category</text><text x="584" y="550" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#596A76" font-weight="400" text-anchor="middle">AP: XGB 0.308 · LR 0.373</text><rect x="820" y="339.8" width="74" height="157.2" rx="4" fill="#25536B"/><text x="857" y="329.82142857142856" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">135</text><rect x="908" y="332.8" width="74" height="164.2" rx="4" fill="#C5742F"/><text x="945" y="322.8357142857143" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243D51" font-weight="700" text-anchor="middle">141</text><text x="899" y="525" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243D51" font-weight="700" text-anchor="middle">Without both</text><text x="899" y="550" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#596A76" font-weight="400" text-anchor="middle">AP: XGB 0.152 · LR 0.284</text><rect x="115" y="578" width="863" height="43" rx="7" fill="#F2F5F7"/><text x="546" y="606" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#42596A" font-weight="400" text-anchor="middle">Feature removal alters refitted models; these differences are not causal feature effects or proof of leakage.</text></svg>